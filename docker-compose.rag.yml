services:
  rocketmq-volume-init:
    image: apache/rocketmq:5.3.2
    user: root
    command: sh -c 'chown -R rocketmq:rocketmq /home/rocketmq/store /home/rocketmq/logs'
    volumes:
      - rocketmq_store:/home/rocketmq/store
      - rocketmq_logs:/home/rocketmq/logs
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: '-Xms128m -Xmx128m -Xmn64m'
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9876"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /etc/rocketmq/broker.conf
    environment:
      JAVA_OPT_EXT: '-Xms256m -Xmx256m -Xmn128m'
    volumes:
      - ./docker/rocketmq/broker.conf:/etc/rocketmq/broker.conf:ro
      - rocketmq_store:/home/rocketmq/store
      - rocketmq_logs:/home/rocketmq/logs
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/10911"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  rocketmq-proxy:
    image: apache/rocketmq:5.3.2
    command: sh mqproxy -pc /etc/rocketmq/proxy.json
    volumes:
      - ./docker/rocketmq/proxy.json:/etc/rocketmq/proxy.json:ro
    environment:
      JAVA_OPT_EXT: '-Xms128m -Xmx256m -Xmn64m'
    ports:
      - '127.0.0.1:18081:18081'
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/18081"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  rocketmq-init:
    image: apache/rocketmq:5.3.2
    command: sh /etc/rocketmq/init.sh
    volumes:
      - ./docker/rocketmq/init.sh:/etc/rocketmq/init.sh:ro
      - rocketmq_store:/home/rocketmq/store
    depends_on:
      rocketmq-proxy:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: red-culture-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
  ingestion-worker:
    build: ./ingestion-worker
    environment:
      ROCKETMQ_ENDPOINTS: rocketmq-proxy:18081
      ROCKETMQ_TOPIC: knowledge-ingest
      ROCKETMQ_CONSUMER_GROUP: knowledge-ingest-worker
      ROCKETMQ_REQUEST_TIMEOUT_SECONDS: ${ROCKETMQ_REQUEST_TIMEOUT_SECONDS:-10}
      INGEST_INVISIBLE_SECONDS: ${INGEST_INVISIBLE_SECONDS:-120}
      INGEST_RENEW_SECONDS: ${INGEST_RENEW_SECONDS:-30}
      INGEST_MAX_ATTEMPTS: ${INGEST_MAX_ATTEMPTS:-3}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_KNOWLEDGE_BUCKET: knowledge
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${KNOWLEDGE_QDRANT_COLLECTION:-${RAG_QDRANT_COLLECTION:-red_culture_content_chunks}}
      RAG_INDEX_VERSION: ${RAG_INDEX_VERSION:-v2}
      MINERU_URL: ${MINERU_URL:-}
      INGEST_CHUNK_CHARS: ${INGEST_CHUNK_CHARS:-1800}
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: red_culture_platform
      EMBEDDING_URL: ${EMBEDDING_URL:-http://host.docker.internal:5050}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      VISION_URL: ${VISION_URL:-http://host.docker.internal:5050}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
    depends_on:
      rocketmq-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  rocketmq_store:
  rocketmq_logs:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
