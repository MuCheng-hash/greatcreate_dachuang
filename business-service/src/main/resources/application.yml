server:
  port: 8080

spring:
  application:
    name: red-culture-business-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/red_culture_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  neo4j:
    uri: ${NEO4J_URI:bolt://127.0.0.1:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:12345678}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.redculture.platform.mapper: debug

app:
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:red-culture-development-jwt-secret-change-me}
    access-token-ttl-seconds: ${APP_AUTH_ACCESS_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${APP_AUTH_REFRESH_TTL_SECONDS:604800}
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${APP_AUTH_COOKIE_SAMESITE:Lax}
    access-cookie-name: ${APP_AUTH_ACCESS_COOKIE_NAME:RC_ACCESS_TOKEN}
    refresh-cookie-name: ${APP_AUTH_REFRESH_COOKIE_NAME:RC_REFRESH_TOKEN}
    csrf-cookie-name: ${APP_AUTH_CSRF_COOKIE_NAME:XSRF-TOKEN}
    csrf-header-name: ${APP_AUTH_CSRF_HEADER_NAME:X-CSRF-TOKEN}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    login-requests-per-minute: ${APP_LOGIN_RATE_LIMIT_PER_MINUTE:10}
    ai-requests-per-minute: ${APP_AI_RATE_LIMIT_PER_MINUTE:30}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin123456}
    display-name: ${APP_ADMIN_DISPLAY_NAME:平台管理员}
  map:
    default-town-region-id: 4
    generated-boundary-radius-km: 1.2
    amap-key: ${AMAP_WEB_KEY:0b5095fedd1afcec744da426d736612a}
    amap-security-js-code: ${AMAP_SECURITY_JS_CODE:}
    llm-service-base-url: ${LLM_SERVICE_BASE_URL:http://127.0.0.1:5050}
  agent:
    internal-service-token: ${AGENT_INTERNAL_SERVICE_TOKEN:}
    prompt-admin-token: ${PROMPT_ADMIN_TOKEN:}
    observability-admin-token: ${OBSERVABILITY_ADMIN_TOKEN:}
    connect-timeout-ms: ${AGENT_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AGENT_READ_TIMEOUT_MS:30000}
    stream-timeout-ms: ${AGENT_STREAM_TIMEOUT_MS:65000}
    agent-runtime-enabled: ${AGENT_RUNTIME_ENABLED:true}
  rag:
    enabled: ${RAG_ENABLED:false}
    sync-on-startup: ${RAG_SYNC_ON_STARTUP:true}
    embedding-base-url: ${RAG_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    embedding-api-key: ${RAG_EMBEDDING_API_KEY:}
    embedding-model: ${RAG_EMBEDDING_MODEL:text-embedding-v3}
    embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
    embedding-batch-size: ${RAG_EMBEDDING_BATCH_SIZE:10}
    qdrant-base-url: ${QDRANT_BASE_URL:http://127.0.0.1:6333}
    qdrant-api-key: ${QDRANT_API_KEY:}
    qdrant-collection: ${QDRANT_COLLECTION:red_culture_content_chunks}
    qdrant-alias: ${QDRANT_ALIAS:red_culture_content_chunks_active}
    index-version: ${RAG_INDEX_VERSION:v2}
    candidate-multiplier: ${RAG_CANDIDATE_MULTIPLIER:4}
    rrf-k: ${RAG_RRF_K:60}
    dense-rrf-weight: ${RAG_DENSE_RRF_WEIGHT:1.0}
    lexical-rrf-weight: ${RAG_LEXICAL_RRF_WEIGHT:1.0}
    base-retrieval-weight: ${RAG_BASE_RETRIEVAL_WEIGHT:0.60}
    entity-match-weight: ${RAG_ENTITY_MATCH_WEIGHT:0.15}
    grade-match-weight: ${RAG_GRADE_MATCH_WEIGHT:0.10}
    theme-match-weight: ${RAG_THEME_MATCH_WEIGHT:0.08}
    source-credibility-weight: ${RAG_SOURCE_CREDIBILITY_WEIGHT:0.03}
    graph-relevance-weight: ${RAG_GRAPH_RELEVANCE_WEIGHT:0.04}
    rerank-candidate-limit: ${RAG_RERANK_CANDIDATE_LIMIT:32}
    graph-candidate-limit: ${RAG_GRAPH_CANDIDATE_LIMIT:24}
    graph-evidence-limit: ${RAG_GRAPH_EVIDENCE_LIMIT:8}
    graph-context-limit: ${RAG_GRAPH_CONTEXT_LIMIT:3}
    joint-evidence-limit: ${RAG_JOINT_EVIDENCE_LIMIT:8}
    relation-expansion-limit: ${RAG_RELATION_EXPANSION_LIMIT:16}
    minimum-vector-score: ${RAG_MINIMUM_VECTOR_SCORE:0.2}
    connect-timeout-ms: ${RAG_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${RAG_READ_TIMEOUT_MS:15000}
