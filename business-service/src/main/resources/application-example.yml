server:
  port: 8080

spring:
  application:
    name: red-culture-business-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/red_culture_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.redculture.platform.mapper: debug

app:
  rag:
    enabled: ${RAG_ENABLED:false}
    sync-on-startup: ${RAG_SYNC_ON_STARTUP:true}
    embedding-base-url: ${RAG_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    embedding-api-key: ${RAG_EMBEDDING_API_KEY:}
    embedding-model: ${RAG_EMBEDDING_MODEL:text-embedding-v3}
    embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
    embedding-batch-size: ${RAG_EMBEDDING_BATCH_SIZE:10}
    qdrant-base-url: ${QDRANT_BASE_URL:http://127.0.0.1:6333}
    qdrant-api-key: ${QDRANT_API_KEY:}
    qdrant-collection: ${QDRANT_COLLECTION:red_culture_content_chunks}
    qdrant-alias: ${QDRANT_ALIAS:red_culture_content_chunks_active}
    index-version: ${RAG_INDEX_VERSION:v2}
    candidate-multiplier: ${RAG_CANDIDATE_MULTIPLIER:4}
    rrf-k: ${RAG_RRF_K:60}
    dense-rrf-weight: ${RAG_DENSE_RRF_WEIGHT:1.0}
    lexical-rrf-weight: ${RAG_LEXICAL_RRF_WEIGHT:1.0}
    hyde-rrf-weight: ${RAG_HYDE_RRF_WEIGHT:0.8}
    web-rrf-weight: ${RAG_WEB_RRF_WEIGHT:0.7}
    augmentation-minimum-candidates: ${RAG_AUGMENTATION_MINIMUM_CANDIDATES:3}
    augmentation-minimum-rrf-score: ${RAG_AUGMENTATION_MINIMUM_RRF_SCORE:0.020}
    base-retrieval-weight: ${RAG_BASE_RETRIEVAL_WEIGHT:0.60}
    entity-match-weight: ${RAG_ENTITY_MATCH_WEIGHT:0.15}
    grade-match-weight: ${RAG_GRADE_MATCH_WEIGHT:0.10}
    theme-match-weight: ${RAG_THEME_MATCH_WEIGHT:0.08}
    source-credibility-weight: ${RAG_SOURCE_CREDIBILITY_WEIGHT:0.03}
    graph-relevance-weight: ${RAG_GRAPH_RELEVANCE_WEIGHT:0.04}
    rerank-candidate-limit: ${RAG_RERANK_CANDIDATE_LIMIT:32}
    graph-candidate-limit: ${RAG_GRAPH_CANDIDATE_LIMIT:24}
    graph-evidence-limit: ${RAG_GRAPH_EVIDENCE_LIMIT:8}
    graph-context-limit: ${RAG_GRAPH_CONTEXT_LIMIT:3}
    joint-evidence-limit: ${RAG_JOINT_EVIDENCE_LIMIT:8}
    relation-expansion-limit: ${RAG_RELATION_EXPANSION_LIMIT:16}
    minimum-vector-score: ${RAG_MINIMUM_VECTOR_SCORE:0.2}
    reranker-enabled: ${RAG_RERANKER_ENABLED:false}
    reranker-base-url: ${RAG_RERANKER_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    reranker-api-key: ${RAG_RERANKER_API_KEY:}
    reranker-model: ${RAG_RERANKER_MODEL:qwen3-rerank}
    reranker-timeout-ms: ${RAG_RERANKER_TIMEOUT_MS:6000}
